name: upstream-bump

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check upstream release
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release=$(gh api repos/llvm-mos/llvm-mos-sdk/releases/latest)
          version=$(printf '%s' "${release}" | jq -r .tag_name)
          sha=$(printf '%s' "${release}" \
            | jq -r '.assets[] | select(.name == "llvm-mos-linux.tar.xz") | .digest' \
            | sed 's/^sha256://')
          case "${version}${sha}" in
            *null*|"") echo "cannot resolve upstream release" >&2; exit 1;;
          esac
          current=$(sed -n 's/^ARG LLVM_MOS_VERSION=//p' Dockerfile)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "changed=$([ "${version}" = "${current}" ] && echo false || echo true)" \
            >> "${GITHUB_OUTPUT}"
          sed -i \
            -e "s|^ARG LLVM_MOS_VERSION=.*|ARG LLVM_MOS_VERSION=${version}|" \
            -e "s|^ARG LLVM_MOS_SHA256=.*|ARG LLVM_MOS_SHA256=${sha}|" Dockerfile

      # PRs opened with GITHUB_TOKEN do not start workflow runs, so the new pin
      # is built and tested here instead of on the pull request.
      - uses: docker/setup-buildx-action@v4
        if: steps.up.outputs.changed == 'true'

      - name: build
        if: steps.up.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mos-llvm-sdk:bump
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        if: steps.up.outputs.changed == 'true'
        run: tests/smoke.sh mos-llvm-sdk:bump ${{ steps.up.outputs.version }}

      - name: open pull request
        if: steps.up.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: llvm-mos-${{ steps.up.outputs.version }}
          commit-message: "llvm-mos SDK ${{ steps.up.outputs.version }}"
          title: "llvm-mos SDK ${{ steps.up.outputs.version }}"
          body: |
            Pin llvm-mos SDK
            [${{ steps.up.outputs.version }}](https://github.com/llvm-mos/llvm-mos-sdk/releases/tag/${{ steps.up.outputs.version }}).

            Built and smoke tested in
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }});
            `ci` does not run on pull requests opened by `GITHUB_TOKEN`.

            Merging releases an image of the same version.
          delete-branch: true
